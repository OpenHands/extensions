name: Build VS Code App

on:
  workflow_dispatch:
  push:
    paths:
      - apps/vscode/**
      - .github/workflows/build-vscode-app.yml

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Build installable App package
        run: node apps/vscode/scripts/package.mjs
      - name: Validate package files
        run: |
          test -f dist/apps/vscode/canvas-extension.json
          test -f dist/apps/vscode/extension.js
          test -f dist/apps/vscode/README.md
          test -z "$(find dist/apps/vscode -type f -name '*.tar.gz' -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-app-${{ github.sha }}
          path: dist/apps/vscode
          if-no-files-found: error

