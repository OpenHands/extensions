[project]
name = "openhands-extensions"
version = "0.36.0"
description = "OpenHands extensions, plugins, and skills (Python bindings for the integration catalog)"
requires-python = ">=3.12"
dependencies = [
    "deprecation>=2.1,<3",
    "packaging>=24,<27",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/openhands_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/catalog" = "openhands_extensions/catalog"

[dependency-groups]
test = [
    "pytest>=8.0",
    "requests>=2.31",
    "openhands-sdk>=0.3",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
pythonpath = ["python", "skills/github/scripts"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.25"
exclude-newer = "7 days"

# Only first-party artifacts bypass the wait, not their dependencies.
exclude-newer-package = { openhands-sdk = false, openhands-tools = false, openhands-workspace = false, openhands-agent-server = false }
