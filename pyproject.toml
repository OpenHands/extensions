[project]
name = "openhands-extensions"
version = "0.43.0"
description = "OpenHands extensions, plugins, and skills (Python bindings for the integration catalog)"
requires-python = ">=3.12"
dependencies = [
    "deprecation>=2.1,<3",
    "packaging>=24,<27",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/openhands_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/catalog" = "openhands_extensions/catalog"

[dependency-groups]
test = [
    "pytest>=8.0",
    "requests>=2.31",
    "openhands-sdk>=0.3",
    # openhands-sdk 1.63.0 allows litellm<1.110 but still imports
    # litellm.llms.openai.chat.gpt_5_transformation, which litellm 1.109 removed.
    # Remove this cap once the SDK stops importing that module.
    "litellm<1.109",
    "jsonschema>=4.23",
    "jmespath>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["python", "skills/github/scripts"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.25"
exclude-newer = "7 days"

# Only first-party artifacts bypass the wait, not their dependencies.
exclude-newer-package = { openhands-sdk = false, openhands-tools = false, openhands-workspace = false, openhands-agent-server = false }
