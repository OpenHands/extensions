[project]
name = "openhands-extensions"
version = "0.20.0"
description = "OpenHands extensions, plugins, and skills (Python bindings for the integration catalog)"
requires-python = ">=3.12"
dependencies = [
    "deprecation>=2.1,<3",
    "packaging>=24,<26",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/openhands_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/catalog" = "openhands_extensions/catalog"

[dependency-groups]
test = [
    "pytest>=8.0",
    "requests>=2.31",
    # Temporary integration pin for software-agent-sdk#5010; replace with its release.
    "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@79021c687c63bd1e925cf157f5897ceeaa12f029#subdirectory=openhands-sdk",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
